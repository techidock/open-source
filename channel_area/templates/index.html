<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Channel Area Calculator</title>
  </head>
  <body>
    <h1>Water Channel Area Calculator</h1>
    <form method="post" onsubmit="return false;">
      <label for="shape">Shape:</label>
      <select name="shape" id="shape" onchange="showFields(); draw()">
        <option value="circular">Circular Channel</option>
        <option value="rectangle">Rectangle Channel</option>
        <option value="polygon">Polygon Channel</option>
      </select>
      <label for="units">Units:</label>
      <select name="units" id="units" onchange="draw()">
        <option value="m">m</option>
        <option value="cm">cm</option>
        <option value="mm">mm</option>
      </select>
      <div id="circular-fields" class="fields">
        <label for="radius">Radius:</label>
        <input type="number" step="any" name="radius" id="radius" oninput="resetCircle()">
        <label for="circle-points">Circle Points:</label>
        <input type="number" id="circle-points" min="3" value="25" oninput="resetCircle()">
      </div>
      <div id="rectangle-fields" class="fields" style="display:none">
        <label for="width">Width:</label>
        <input type="number" step="any" name="width" id="width" oninput="resetRectangle()">
        <label for="depth">Depth:</label>
        <input type="number" step="any" name="depth" id="depth" oninput="resetRectangle()">
      </div>
      <div id="polygon-fields" class="fields" style="display:none">
        <label for="num-points">Points:</label>
        <input type="number" id="num-points" min="3" value="3" onchange="resetPolygon()">
        <button type="button" onclick="clearPolygon()">Clear Polygon Channel</button>
      </div>
      <label for="water-height">Water Height:</label>
      <input type="number" step="any" id="water-height" min="0" oninput="draw()">
      <button onclick="calculateArea()">Calculate</button>
    </form>
    <canvas id="canvas" width="400" height="300" style="border:1px solid #000;margin-top:10px;"></canvas>
    <div>
      <button type="button" onclick="setOrientation(0)">Two Points Down</button>
      <button type="button" onclick="setOrientation(1)">One Point Down</button>
      <label><input type="checkbox" id="scale-toggle" checked> Allow Scaling</label>
      <button type="button" onclick="undoEdit()">Undo</button>
      <button type="button" onclick="redoEdit()">Redo</button>
    </div>
      <div style="margin-top:5px;">
        <button type="button" onclick="openShapeDialog()">Manage Shapes</button>
      </div>
      <dialog id="shape-dialog">
        <form method="dialog" onsubmit="return false;">
          <label>Name: <input type="text" id="shape-name"></label>
          <button type="button" onclick="saveShape()">Save</button>
          <select id="load-list"></select>
          <button type="button" onclick="loadShape()">Load</button>
          <button type="button" onclick="closeShapeDialog()">Close</button>
        </form>
      </dialog>
    <p id="area-display"></p>
    <p id="water-area-display"></p>
    <p id="cursor-pos">Cursor:</p>
    <table id="points-table" border="1" style="border-collapse:collapse">
      <thead>
        <tr><th>Index</th><th>x</th><th>y</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    {% if area is not none %}
      <h2>Area of {{ shape }}: {{ area }} {{ units }}²</h2>
    {% endif %}

  <script>
      function showFields() {
        var shape = document.getElementById('shape').value;
        document.getElementById('circular-fields').style.display = shape == 'circular' ? 'block' : 'none';
        document.getElementById('rectangle-fields').style.display = shape == 'rectangle' ? 'block' : 'none';
        document.getElementById('polygon-fields').style.display = shape == 'polygon' ? 'block' : 'none';
        polygonMode = shape == 'polygon';
        setDefaults(shape);
      }

      function setDefaults(shape) {
        if (shape == 'circular') {
          document.getElementById('radius').value = 50;
          document.getElementById('circle-points').value = 25;
          resetCircle();
          document.getElementById('water-height').value = (parseFloat(document.getElementById('radius').value) * 2).toFixed(1);
          waterHeight = parseFloat(document.getElementById('water-height').value);
        } else if (shape == 'rectangle') {
          document.getElementById('width').value = 200;
          document.getElementById('depth').value = 50;
          resetRectangle();
          document.getElementById('water-height').value = document.getElementById('depth').value;
          waterHeight = parseFloat(document.getElementById('water-height').value);
        } else if (shape == 'polygon') {
          document.getElementById('num-points').value = 3;
          resetPolygon();
          var maxH = shapeHeight(points);
          document.getElementById('water-height').value = maxH.toFixed(1);
          waterHeight = maxH;
        }
      }

      var canvas, ctx;
      var dragging = false;
      var polygonMode = false;
      var orientation = 0;
      var points = [];
      var numPoints = 3;
      var editIndex = -1;
      var editShape = '';
      var shapePts = [];
      var scaleEnabled = true;
      var undoStack = [];
      var redoStack = [];
      var waterHeight = 0;

      function init() {
        canvas = document.getElementById('canvas');
        ctx = canvas.getContext('2d');
        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mousemove', drag);
        canvas.addEventListener('mousemove', showCursorPos);
        canvas.addEventListener('mouseleave', clearCursorPos);
        canvas.addEventListener('mouseup', endDrag);
        canvas.addEventListener('dblclick', selectPoint);
        document.getElementById('scale-toggle').onchange = function(){
          scaleEnabled = this.checked;
        };
        updateShapeList();
        showFields();
        waterHeight = parseFloat(document.getElementById('water-height').value) || 0;
        draw();
      }

      function startDrag(e) {
        if (!scaleEnabled) return;
        var shape = document.getElementById('shape').value;
        if (editIndex >= 0) {
          dragging = true;
          movePoint(e);
          return;
        }
        if (polygonMode) {
          addPoint(e);
          return;
        }
        dragging = true;
        updateFromMouse(e);
      }

      function drag(e) {
        if (!dragging) return;
        if (editIndex >= 0) {
          movePoint(e);
        } else {
          updateFromMouse(e);
        }
      }

      function endDrag(e) {
        dragging = false;
        if (editIndex >= 0) {
          editIndex = -1;
          draw();
        }
      }

      function updateFromMouse(e) {
        if (!scaleEnabled) return;
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var shape = document.getElementById('shape').value;
        saveState();
        if (shape == 'circular') {
          var r = canvas.height - y;
          document.getElementById('radius').value = r.toFixed(1);
          resetCircle();
        } else if (shape == 'rectangle') {
          document.getElementById('width').value = x.toFixed(1);
          document.getElementById('depth').value = (canvas.height - y).toFixed(1);
          resetRectangle();
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        var shape = document.getElementById('shape').value;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;

        var pts = getShapePoints(shape);
        var maxHeight = shapeHeight(pts);
        shapePts = pts;
        var whInput = document.getElementById('water-height');
        waterHeight = parseFloat(whInput.value) || 0;
        waterHeight = clamp(waterHeight, 0, maxHeight);
        whInput.value = waterHeight.toFixed(1);
        var yLine = canvas.height - waterHeight;
        if (pts.length > 0) {
          var below = clipBelow(pts, yLine);
          var above = clipAbove(pts, yLine);
          if (above.length > 0) {
            ctx.fillStyle = '#cccccc';
            ctx.beginPath();
            ctx.moveTo(above[0].x, above[0].y);
            for (var i = 1; i < above.length; i++) ctx.lineTo(above[i].x, above[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
          if (below.length > 0) {
            ctx.fillStyle = '#99ccff';
            ctx.beginPath();
            ctx.moveTo(below[0].x, below[0].y);
            for (var i = 1; i < below.length; i++) ctx.lineTo(below[i].x, below[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        }

        for (var i = 0; i < pts.length; i++) {
          var color = (i === editIndex && editShape === shape) ? '#000' : '#0000ff';
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(pts[i].x, pts[i].y, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (var i = 0; i < pts.length; i++) {
          minX = Math.min(minX, pts[i].x);
          maxX = Math.max(maxX, pts[i].x);
          minY = Math.min(minY, pts[i].y);
          maxY = Math.max(maxY, pts[i].y);
        }
        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.arc(minX, minY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(maxX, maxY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#00f';
        ctx.beginPath();
        ctx.moveTo(minX, yLine);
        ctx.lineTo(maxX, yLine);
        ctx.stroke();
        ctx.strokeStyle = '#000';
        updateCoords(pts);
        var area = polygonArea(pts);
        var waterPts = clipBelow(pts, yLine);
        var waterArea = polygonArea(waterPts);
        var units = document.getElementById('units').value;
        document.getElementById('area-display').textContent = 'Area: ' + area.toFixed(2) + ' ' + units + '^2';
        document.getElementById('water-area-display').textContent = 'Water Area: ' + waterArea.toFixed(2) + ' ' + units + '^2';
      }

      function calculateArea() {
        draw();
      }

      function polygonArea(pts) {
        if (pts.length < 3) return 0;
        var sum = 0;
        for (var i = 0; i < pts.length; i++) {
          var j = (i + 1) % pts.length;
          sum += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
        }
        return Math.abs(sum / 2);
      }

      function shapeHeight(pts) {
        if (pts.length === 0) return 0;
        var minY = canvas.height;
        for (var i = 0; i < pts.length; i++) {
          minY = Math.min(minY, pts[i].y);
        }
        return canvas.height - minY;
      }

      function clipBelow(pts, yLine) {
        var out = [];
        for (var i = 0; i < pts.length; i++) {
          var a = pts[i];
          var b = pts[(i + 1) % pts.length];
          var aInside = a.y >= yLine;
          var bInside = b.y >= yLine;
          if (aInside && bInside) {
            out.push(b);
          } else if (aInside && !bInside) {
            var x = a.x + (yLine - a.y) * (b.x - a.x) / (b.y - a.y);
            out.push({x: x, y: yLine});
          } else if (!aInside && bInside) {
            var x1 = a.x + (yLine - a.y) * (b.x - a.x) / (b.y - a.y);
            out.push({x: x1, y: yLine});
            out.push(b);
          }
        }
        return out;
      }

      function clipAbove(pts, yLine) {
        var out = [];
        for (var i = 0; i < pts.length; i++) {
          var a = pts[i];
          var b = pts[(i + 1) % pts.length];
          var aInside = a.y <= yLine;
          var bInside = b.y <= yLine;
          if (aInside && bInside) {
            out.push(b);
          } else if (aInside && !bInside) {
            var x = a.x + (yLine - a.y) * (b.x - a.x) / (b.y - a.y);
            out.push({x: x, y: yLine});
          } else if (!aInside && bInside) {
            var x1 = a.x + (yLine - a.y) * (b.x - a.x) / (b.y - a.y);
            out.push({x: x1, y: yLine});
            out.push(b);
          }
        }
        return out;
      }

      function addPoint(e) {
        if (!scaleEnabled) return;
        var rect = canvas.getBoundingClientRect();
        if (points.length < numPoints) {
          saveState();
          points.push({x: e.clientX - rect.left, y: e.clientY - rect.top});
          draw();
        }
      }

      function selectPoint(e) {
        if (!scaleEnabled) return;
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var shape = document.getElementById('shape').value;
        var pts = getShapePoints(shape);
        editIndex = -1;
        for (var i = 0; i < pts.length; i++) {
          var dx = pts[i].x - x;
          var dy = pts[i].y - y;
          if (Math.sqrt(dx*dx + dy*dy) < 6) {
            editIndex = i;
            editShape = shape;
            break;
          }
        }
        draw();
      }

      function movePoint(e) {
        if (!(e.buttons & 1) || !scaleEnabled) return;
        var rect = canvas.getBoundingClientRect();
        var x = clamp(e.clientX - rect.left, 0, canvas.width);
        var y = clamp(e.clientY - rect.top, 0, canvas.height);
        saveState();
        points[editIndex] = {x: x, y: y};
        draw();
      }

      function clearPolygon() {
        saveState();
        points = [];
        draw();
      }

      function resetPolygon() {
        saveState();
        numPoints = parseInt(document.getElementById('num-points').value) || 3;
        points = defaultPolygon(numPoints);
        waterHeight = shapeHeight(points);
        document.getElementById('water-height').value = waterHeight.toFixed(1);
        draw();
      }

      function defaultPolygon(n) {
        var r = 60;
        var cx = canvas.width / 2;
        var cy = canvas.height - r;
        var pts = [];
        for (var i = 0; i < n; i++) {
          var ang = Math.PI / 2 + (i / n) * Math.PI * 2;
          pts.push({x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang)});
        }
        return pts;
      }

      function resetCircle() {
        saveState();
        var r = parseFloat(document.getElementById('radius').value) || 0;
        var n = parseInt(document.getElementById('circle-points').value) || 25;
        var cx = canvas.width / 2;
        var cy = canvas.height - r;
        points = [];
        for (var i = 0; i < n; i++) {
          var ang = (i / n) * Math.PI * 2;
          points.push({x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang)});
        }
        waterHeight = 2 * r;
        document.getElementById('water-height').value = waterHeight.toFixed(1);
        draw();
      }

      function resetRectangle() {
        saveState();
        var w = parseFloat(document.getElementById('width').value) || 0;
        var d = parseFloat(document.getElementById('depth').value) || 0;
        var cx = canvas.width / 2;
        points = [
          {x: cx - w/2, y: canvas.height},
          {x: cx + w/2, y: canvas.height},
          {x: cx + w/2, y: canvas.height - d},
          {x: cx - w/2, y: canvas.height - d}
        ];
        waterHeight = d;
        document.getElementById('water-height').value = waterHeight.toFixed(1);
        draw();
      }

      function updateCoords(pts) {
        var tbody = document.getElementById('points-table').querySelector('tbody');
        tbody.innerHTML = '';
        for (var i = 0; i < pts.length; i++) {
          var tr = document.createElement('tr');
          var tdI = document.createElement('td');
          tdI.textContent = i;
          var tdX = document.createElement('td');
          var inputX = document.createElement('input');
          inputX.type = 'number';
          inputX.value = pts[i].x.toFixed(1);
          inputX.min = 0;
          inputX.max = canvas.width;
          inputX.dataset.index = i;
          inputX.onchange = tableChanged;
          tdX.appendChild(inputX);
          var tdY = document.createElement('td');
          var inputY = document.createElement('input');
          inputY.type = 'number';
          inputY.value = (canvas.height - pts[i].y).toFixed(1);
          inputY.min = 0;
          inputY.max = canvas.height;
          inputY.dataset.index = i;
          inputY.onchange = tableChanged;
          tdY.appendChild(inputY);
          tr.appendChild(tdI);
          tr.appendChild(tdX);
          tr.appendChild(tdY);
          tbody.appendChild(tr);
        }
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function saveState() {
        undoStack.push({points: JSON.parse(JSON.stringify(points)), orientation: orientation});
        if (undoStack.length > 50) undoStack.shift();
        redoStack = [];
      }

      function tableChanged(e) {
        if (!scaleEnabled) {
          draw();
          return;
        }
        var idx = parseInt(e.target.dataset.index);
        var row = e.target.parentElement.parentElement;
        var x = parseFloat(row.children[1].firstChild.value);
        var y = parseFloat(row.children[2].firstChild.value);
        x = clamp(x, 0, canvas.width);
        y = clamp(y, 0, canvas.height);
        row.children[1].firstChild.value = x;
        row.children[2].firstChild.value = y;
        saveState();
        points[idx] = {x: x, y: canvas.height - y};
        draw();
      }

      function showCursorPos(e) {
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = canvas.height - (e.clientY - rect.top);
        document.getElementById('cursor-pos').textContent = 'Cursor: (' + x.toFixed(1) + ', ' + y.toFixed(1) + ')';
      }

      function clearCursorPos() {
        document.getElementById('cursor-pos').textContent = 'Cursor:';
      }

      function setOrientation(o) {
        saveState();
        orientation = o;
        draw();
      }

      function getShapePoints(shape) {
        return applyOrientation(points.slice(), shape);
      }

      function applyOrientation(pts, shape) {
        if (orientation == 0) return pts;
        var ang = 0;
        if (shape == 'rectangle') {
          ang = Math.PI / 4;
        } else if (shape == 'polygon') {
          ang = Math.PI / pts.length;
        }
        if (ang === 0) return pts;
        var cx = canvas.width / 2;
        var cy = canvas.height;
        var rot = [];
        for (var i = 0; i < pts.length; i++) {
          var dx = pts[i].x - cx;
          var dy = pts[i].y - cy;
          rot.push({
            x: cx + dx * Math.cos(ang) - dy * Math.sin(ang),
            y: cy + dx * Math.sin(ang) + dy * Math.cos(ang)
          });
        }
        return rot;
      }

      function undoEdit() {
        if (undoStack.length === 0) return;
        redoStack.push({points: JSON.parse(JSON.stringify(points)), orientation: orientation});
        var state = undoStack.pop();
        points = JSON.parse(JSON.stringify(state.points));
        orientation = state.orientation;
        draw();
      }

      function redoEdit() {
        if (redoStack.length === 0) return;
        undoStack.push({points: JSON.parse(JSON.stringify(points)), orientation: orientation});
        var state = redoStack.pop();
        points = JSON.parse(JSON.stringify(state.points));
        orientation = state.orientation;
        draw();
      }

      function saveShape() {
        var name = document.getElementById('shape-name').value.trim();
        if (!name) return;
        fetch('/save_shape', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: name, points: points})
        }).then(updateShapeList);
      }

      function updateShapeList() {
        fetch('/list_shapes').then(r => r.json()).then(data => {
          var sel = document.getElementById('load-list');
          sel.innerHTML = '';
          data.shapes.forEach(function(n){
            var opt = document.createElement('option');
            opt.value = n;
            opt.textContent = n;
            sel.appendChild(opt);
          });
        });
      }

      function loadShape() {
        var name = document.getElementById('load-list').value;
        if (!name) return;
        fetch('/load_shape/' + name).then(r => r.json()).then(data => {
          if (data.points) {
            saveState();
            points = data.points;
            document.getElementById('shape').value = 'polygon';
            draw();
          }
        });
      }

      function openShapeDialog() {
        updateShapeList();
        document.getElementById('shape-dialog').showModal();
      }

      function closeShapeDialog() {
        document.getElementById('shape-dialog').close();
      }

      function drawGrid() {
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1;
        for (var x = 0; x <= canvas.width; x += 20) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (var y = 0; y <= canvas.height; y += 20) {
          var gy = canvas.height - y;
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(canvas.width, gy);
          ctx.stroke();
        }
        ctx.strokeStyle = '#000';
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        ctx.lineTo(canvas.width, canvas.height);
        ctx.moveTo(0, canvas.height);
        ctx.lineTo(0, 0);
        ctx.stroke();
        ctx.fillText('x', canvas.width - 10, canvas.height - 5);
        ctx.fillText('y', 5, 10);
      }

      window.onload = init;
  </script>
  </body>
</html>
