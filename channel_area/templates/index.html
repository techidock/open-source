<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Channel Area Calculator</title>
  </head>
  <body>
    <h1>Water Channel Area Calculator</h1>
    <form method="post" onsubmit="return false;">
      <label for="shape">Shape:</label>
      <select name="shape" id="shape" onchange="showFields(); draw()">
        <option value="circular">Circular Channel</option>
        <option value="rectangle">Rectangle Channel</option>
        <option value="poly">Polygon</option>
      </select>
      <label for="units">Units:</label>
      <select name="units" id="units" onchange="draw()">
        <option value="m">m</option>
        <option value="cm">cm</option>
        <option value="mm">mm</option>
      </select>
      <div id="circular-fields" class="fields">
        <label for="radius">Radius:</label>
        <input type="number" step="any" name="radius" id="radius" oninput="draw()">
        <label for="circle-points">Circle Points:</label>
        <input type="number" id="circle-points" min="3" value="25" oninput="draw()">
      </div>
      <div id="rectangle-fields" class="fields" style="display:none">
        <label for="width">Width:</label>
        <input type="number" step="any" name="width" id="width" oninput="draw()">
        <label for="depth">Depth:</label>
        <input type="number" step="any" name="depth" id="depth" oninput="draw()">
      </div>
      <div id="poly-fields" class="fields" style="display:none">
        <label for="num-points">Points:</label>
        <input type="number" id="num-points" min="3" value="3" onchange="resetPolygon()">
        <button type="button" onclick="clearPolygon()">Clear Polygon</button>
      </div>
      <button onclick="calculateArea()">Calculate</button>
    </form>
    <canvas id="canvas" width="400" height="300" style="border:1px solid #000;margin-top:10px;"></canvas>
    <p id="area-display"></p>
    <pre id="coord-display"></pre>
    {% if area is not none %}
      <h2>Area of {{ shape }}: {{ area }} {{ units }}²</h2>
    {% endif %}

  <script>
      function showFields() {
        var shape = document.getElementById('shape').value;
        document.getElementById('circular-fields').style.display = shape == 'circular' ? 'block' : 'none';
        document.getElementById('rectangle-fields').style.display = shape == 'rectangle' ? 'block' : 'none';
        document.getElementById('poly-fields').style.display = shape == 'poly' ? 'block' : 'none';
        polyMode = shape == 'poly';
        setDefaults(shape);
      }

      function setDefaults(shape) {
        if (shape == 'circular') {
          document.getElementById('radius').value = 50;
          document.getElementById('circle-points').value = 25;
        } else if (shape == 'rectangle') {
          document.getElementById('width').value = 200;
          document.getElementById('depth').value = 50;
        } else if (shape == 'poly') {
          document.getElementById('num-points').value = 3;
          resetPolygon();
        }
        draw();
      }

      var canvas, ctx;
      var dragging = false;
      var polyMode = false;
      var points = [];
      var numPoints = 3;
      var editIndex = -1;

      function init() {
        canvas = document.getElementById('canvas');
        ctx = canvas.getContext('2d');
        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mousemove', drag);
        canvas.addEventListener('mouseup', endDrag);
        canvas.addEventListener('dblclick', selectPoint);
        showFields();
        draw();
      }

      function startDrag(e) {
        if (polyMode) {
          if (editIndex >= 0) {
            dragging = true;
            movePoint(e);
          } else {
            addPoint(e);
          }
          return;
        }
        dragging = true;
        updateFromMouse(e);
      }

      function drag(e) {
        if (!dragging) return;
        if (polyMode && editIndex >= 0) {
          movePoint(e);
        } else {
          updateFromMouse(e);
        }
      }

      function endDrag(e) {
        dragging = false;
        if (polyMode && editIndex >= 0) {
          editIndex = -1;
          draw();
        }
      }

      function updateFromMouse(e) {
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var shape = document.getElementById('shape').value;
        if (shape == 'circular') {
          var r = canvas.height - y;
          document.getElementById('radius').value = r.toFixed(1);
        } else if (shape == 'rectangle') {
          document.getElementById('width').value = x.toFixed(1);
          document.getElementById('depth').value = (canvas.height - y).toFixed(1);
        }
        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        var shape = document.getElementById('shape').value;
        ctx.fillStyle = '#99ccff';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;

        var pts = getShapePoints(shape);
        if (pts.length > 0) {
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        if (polyMode) {
          for (var i = 0; i < points.length; i++) {
            ctx.fillStyle = (i === editIndex) ? '#000' : '#0000ff';
            ctx.beginPath();
            ctx.arc(points[i].x, points[i].y, 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#99ccff';
        }
        updateCoords(pts);
        var area = polygonArea(pts);
        var units = document.getElementById('units').value;
        document.getElementById('area-display').textContent = 'Area: ' + area.toFixed(2) + ' ' + units + '^2';
      }

      function calculateArea() {
        var shape = document.getElementById('shape').value;
        var pts = getShapePoints(shape);
        var area = polygonArea(pts);
        var units = document.getElementById('units').value;
        document.getElementById('area-display').textContent = 'Area: ' + area.toFixed(2) + ' ' + units + '^2';
      }

      function polygonArea(pts) {
        if (pts.length < 3) return 0;
        var sum = 0;
        for (var i = 0; i < pts.length; i++) {
          var j = (i + 1) % pts.length;
          sum += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
        }
        return Math.abs(sum / 2);
      }

      function addPoint(e) {
        var rect = canvas.getBoundingClientRect();
        if (points.length < numPoints) {
          points.push({x: e.clientX - rect.left, y: e.clientY - rect.top});
          draw();
        }
      }

      function selectPoint(e) {
        if (!polyMode) return;
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        editIndex = -1;
        for (var i = 0; i < points.length; i++) {
          var dx = points[i].x - x;
          var dy = points[i].y - y;
          if (Math.sqrt(dx*dx + dy*dy) < 6) {
            editIndex = i;
            break;
          }
        }
        draw();
      }

      function movePoint(e) {
        var rect = canvas.getBoundingClientRect();
        points[editIndex] = {x: e.clientX - rect.left, y: e.clientY - rect.top};
        draw();
      }

      function clearPolygon() {
        points = [];
        draw();
      }

      function resetPolygon() {
        numPoints = parseInt(document.getElementById('num-points').value) || 3;
        points = defaultPolygon(numPoints);
        draw();
      }

      function defaultPolygon(n) {
        var r = 60;
        var cx = canvas.width / 2;
        var cy = canvas.height - r;
        var pts = [];
        for (var i = 0; i < n; i++) {
          var ang = Math.PI / 2 + (i / n) * Math.PI * 2;
          pts.push({x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang)});
        }
        return pts;
      }

      function updateCoords(pts) {
        var out = '';
        for (var i = 0; i < pts.length; i++) {
          out += i + ': (' + pts[i].x.toFixed(1) + ', ' + pts[i].y.toFixed(1) + ')\n';
        }
        document.getElementById('coord-display').textContent = out;
      }

      function getShapePoints(shape) {
        if (shape == 'circular') {
          var r = parseFloat(document.getElementById('radius').value) || 0;
          var n = parseInt(document.getElementById('circle-points').value) || 25;
          var cx = canvas.width / 2;
          var cy = canvas.height - r;
          var pts = [];
          for (var i = 0; i < n; i++) {
            var ang = (i / n) * Math.PI * 2;
            pts.push({x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang)});
          }
          return pts;
        } else if (shape == 'rectangle') {
          var w = parseFloat(document.getElementById('width').value) || 0;
          var d = parseFloat(document.getElementById('depth').value) || 0;
          var cx = canvas.width / 2;
          return [
            {x: cx - w/2, y: canvas.height},
            {x: cx + w/2, y: canvas.height},
            {x: cx + w/2, y: canvas.height - d},
            {x: cx - w/2, y: canvas.height - d}
          ];
        } else {
          return points.slice();
        }
      }

      function drawGrid() {
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1;
        for (var x = 0; x <= canvas.width; x += 20) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (var y = 0; y <= canvas.height; y += 20) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
        ctx.strokeStyle = '#000';
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        ctx.lineTo(canvas.width, canvas.height);
        ctx.moveTo(0, canvas.height);
        ctx.lineTo(0, 0);
        ctx.stroke();
        ctx.fillText('x', canvas.width - 10, canvas.height - 5);
        ctx.fillText('y', 5, 10);
      }

      window.onload = init;
  </script>
  </body>
</html>
