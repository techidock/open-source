<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Channel Area Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <h1>Water Channel Area Calculator</h1>
    <nav id="menu">
      <button type="button" onclick="openNewChannelDialog()">New Channel</button>
      <button type="button" onclick="openShapeDialog()">Manage Shapes</button>
      <button type="button" onclick="openSetupDialog()">Setup</button>
      <div id="tools-menu" style="display:inline-block;">
        <label style="color:#fff; margin-left:8px;">
          <input type="checkbox" id="measure-toggle"> Enable Measurements
        </label>
        <button type="button" onclick="clearMeasurement()">Clear</button>
      </div>
    </nav>
    <dialog id="new-channel-dialog">
      <form method="dialog" onsubmit="return false;">
        <label for="shape">Shape:</label>
        <select name="shape" id="shape" onchange="showFields(); draw()">
          <option value="polygon">Polygon Channel</option>
          <option value="circle">Circular Channel</option>
        </select>
        <div id="circular-fields" class="fields" style="display:none">
          <label for="circle-diameter">Diameter:</label>
          <input type="number" id="circle-diameter" value="1000" oninput="resetCircle()">
          <span id="circle-unit"></span>
          <label for="circle-points">Points:</label>
          <input type="number" id="circle-points" min="3" value="30" onchange="resetCircle()">
        </div>
        <div id="rectangle-fields" class="fields" style="display:none"></div>
        <div id="polygon-fields" class="fields" style="display:none">
          <label for="num-points">Points:</label>
          <input type="number" id="num-points" min="3" value="3" onchange="resetPolygon()">
          <button type="button" onclick="clearPolygon()">Clear Polygon Channel</button>
        </div>
        <button type="button" onclick="closeNewChannelDialog()">Close</button>
      </form>
    </dialog>
    <div id="layout">
      <div id="drawing-area">
        <canvas id="canvas" width="500" height="375" style="border:1px solid #000;margin-top:10px;"></canvas>
        <div>
          <button type="button" onclick="setOrientation(0)">Two Points Down</button>
          <button type="button" onclick="setOrientation(1)">One Point Down</button>
          <label><input type="checkbox" id="edit-toggle" checked> Edit</label>
          <label><input type="checkbox" id="add-point-toggle"> Add Points</label>
          <button type="button" onclick="undoEdit()">Undo</button>
          <button type="button" onclick="redoEdit()">Redo</button>
          <label><input type="checkbox" id="vectors-toggle" checked> Show Vectors</label>
        </div>
      </div>
      <aside id="display-properties">
        <h3>Display Properties</h3>
        <p id="grid-info"></p>
        <p id="cursor-pos">Cursor:</p>
      </aside>
      <aside id="channel-properties">
        <h3>Channel Properties</h3>
        <p id="width-label"></p>
        <p id="height-label"></p>
        <p id="area-display"></p>
      </aside>
    </div>
      <dialog id="shape-dialog">
        <form method="dialog" onsubmit="return false;">
          <label>Name: <input type="text" id="shape-name"></label>
          <button type="button" onclick="saveShape()">Save</button>
          <select id="load-list"></select>
          <button type="button" onclick="loadShape()">Load</button>
          <button type="button" onclick="closeShapeDialog()">Close</button>
        </form>
      </dialog>
      <dialog id="setup-dialog">
        <form method="dialog" onsubmit="return false;">
          <label for="units">Display Units:</label>
          <select name="units" id="units" onchange="updateUnitDisplay()">
            <option value="m">m</option>
            <option value="cm">cm</option>
            <option value="mm">mm</option>
          </select>
          <label for="draw-width">Draw Width:</label>
          <input type="number" id="draw-width" value="4000" oninput="updateDrawSize()">
          <label for="draw-height">Draw Height:</label>
          <input type="number" id="draw-height" value="4000" oninput="updateDrawSize()">
          <span id="draw-unit"></span>
          <label for="shape-scale">Shape Scale:</label>
          <input type="number" step="0.1" id="shape-scale" value="1" min="0.1" oninput="scaleShape(this.value)">
          <button type="button" onclick="closeSetupDialog()">Close</button>
        </form>
      </dialog>
    <p id="water-area-display"></p>
    <p id="silt-area-display"></p>
    <div id="water-controls" style="margin-top:5px;">
      <label for="water-height">Water Height:</label>
      <input type="number" step="any" id="water-height" min="0" oninput="draw()">
      <span id="water-unit"></span>
      <label for="silt-height">Silt Height:</label>
      <input type="number" step="any" id="silt-height" min="0" oninput="draw()">
      <span id="silt-unit"></span>
      <label for="height-units">Height Units:</label>
      <select id="height-units" onchange="updateHeightUnitDisplay()">
        <option value="m">m</option>
        <option value="cm">cm</option>
        <option value="mm">mm</option>
      </select>
      <button onclick="calculateArea()">Calculate</button>
    </div>
    <div id="inspect">
      <label><input type="checkbox" id="measure-toggle"> Enable Measurements</label>
      <button type="button" onclick="clearMeasurement()">Clear</button>
    </div>
    <table id="points-table" border="1" style="border-collapse:collapse">
      <thead>
        <tr><th>Index</th><th>x</th><th>y</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    {% if area is not none %}
      <h2>Area of {{ shape }}: {{ area }} {{ units }}²</h2>
    {% endif %}

  <script>
      function showFields() {
        var shape = document.getElementById('shape').value;
        document.getElementById('polygon-fields').style.display = shape === 'polygon' ? 'block' : 'none';
        document.getElementById('circular-fields').style.display = shape === 'circle' ? 'block' : 'none';
        if (shape === 'polygon') {
          resetPolygon();
        } else if (shape === 'circle') {
          resetCircle();
        }
      }

      var canvas, ctx;
      var blueCursor = 'url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgc3Ryb2tlPSJibHVlIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiPjxsaW5lIHgxPSI4IiB5MT0iMCIgeDI9IjgiIHkyPSIxNiIvPjxsaW5lIHgxPSIwIiB5MT0iOCIgeDI9IjE2IiB5Mj0iOCIvPjwvc3ZnPg==") 8 8, auto';
      var dragging = false;
      var polygonMode = false;
      var orientation = 0;
      var points = [];
      var numPoints = 3;
      var editIndex = -1;
      var hoverIndex = -1;
      var editShape = '';
      var shapePts = [];
      var editEnabled = true;
      var addPointEnabled = false;
      var vectorsVisible = true;
      var undoStack = [];
      var redoStack = [];
      var waterHeightMM = 0;
      var siltHeightMM = 0;
      var drawWidthMM = 4000;
      var drawHeightMM = 4000;
      var mmScale = 1;
      var gridSpacingMM = 500;
      var polygonScale = 1;
      var circleDiameterMM = 1000;
      var measureMode = false;
      var measureStart = null;
      var measureEnd = null;
      var measuring = false;
      var measureDrag = null;

      function unitFactor() {
        var u = document.getElementById('units').value;
        if (u === 'm') return 1000;
        if (u === 'cm') return 10;
        return 1;
      }

      function heightUnitFactor() {
        var u = document.getElementById('height-units').value;
        if (u === 'm') return 1000;
        if (u === 'cm') return 10;
        return 1;
      }

      function updateUnitDisplay() {
        var f = unitFactor();
        document.getElementById('draw-width').value = (drawWidthMM / f).toFixed(1);
        document.getElementById('draw-height').value = (drawHeightMM / f).toFixed(1);
        document.getElementById('draw-unit').textContent = document.getElementById('units').value;
        document.getElementById('circle-diameter').value = (circleDiameterMM / f).toFixed(1);
        document.getElementById('circle-unit').textContent = document.getElementById('units').value;
        updateHeightUnitDisplay();
        updateGridInfo();
        anchorBottomCenter();
        draw();
      }

      function updateHeightUnitDisplay() {
        var f = heightUnitFactor();
        document.getElementById('water-height').value = (waterHeightMM / f).toFixed(1);
        document.getElementById('silt-height').value = (siltHeightMM / f).toFixed(1);
        var u = document.getElementById('height-units').value;
        document.getElementById('water-unit').textContent = u;
        document.getElementById('silt-unit').textContent = u;
        draw();
      }

      function updateDrawSize() {
        var f = unitFactor();
        var newW = parseFloat(document.getElementById('draw-width').value) * f || 4000;
        var newH = parseFloat(document.getElementById('draw-height').value) * f || 4000;
        var oldScale = mmScale;
        drawWidthMM = newW;
        drawHeightMM = newH;
        mmScale = Math.max(drawWidthMM / canvas.width, drawHeightMM / canvas.height);
        var factor = oldScale / mmScale;
        if (factor !== 1) {
          for (var i = 0; i < points.length; i++) {
            points[i].x *= factor;
            points[i].y *= factor;
          }
          anchorBottomCenter();
        }
        updateGridInfo();
        draw();
      }

      function unitToPxX(v) { return v * unitFactor() / mmScale; }
      function unitToPxY(v) { return v * unitFactor() / mmScale; }
      function pxToUnitX(px) { return px * mmScale / unitFactor(); }
      function pxToUnitY(px) { return px * mmScale / unitFactor(); }
      function mmToPxX(mm) { return mm / mmScale; }
      function mmToPxY(mm) { return mm / mmScale; }
      function pxToMMX(px) { return px * mmScale; }
      function pxToMMY(px) { return px * mmScale; }

      function updateGridInfo() {
        var units = document.getElementById('units').value;
        document.getElementById('grid-info').textContent = 'Grid: ' + (gridSpacingMM / unitFactor()).toFixed(1) + ' ' + units;
      }

      function init() {
        canvas = document.getElementById('canvas');
        ctx = canvas.getContext('2d');
        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mousemove', drag);
        canvas.addEventListener('mousemove', showCursorPos);
        canvas.addEventListener('mouseleave', clearCursorPos);
        canvas.addEventListener('mouseup', endDrag);
        canvas.addEventListener('dblclick', handleDoubleClick);
        document.getElementById('edit-toggle').onchange = function(){
          editEnabled = this.checked;
        };
        document.getElementById('add-point-toggle').onchange = function(){
          addPointEnabled = this.checked;
        };
        document.getElementById('vectors-toggle').onchange = function(){
          vectorsVisible = this.checked;
          draw();
        };
        document.getElementById('measure-toggle').onchange = function(){
          measureMode = this.checked;
          if (!measureMode) clearMeasurement();
        };
        updateShapeList();
        showFields();
        updateUnitDisplay();
        updateHeightUnitDisplay();
        mmScale = Math.max(drawWidthMM / canvas.width, drawHeightMM / canvas.height);
        updateGridInfo();
        waterHeightMM = parseFloat(document.getElementById('water-height').value) * heightUnitFactor() || 0;
        siltHeightMM = parseFloat(document.getElementById('silt-height').value) * heightUnitFactor() || 0;
        fetch('/load_shape/_last').then(r => {
          if (r.ok) return r.json();
        }).then(data => {
          if (data && data.points) {
            points = data.points.map(p => ({x: mmToPxX(p.x), y: mmToPxY(p.y)}));
            orientation = data.orientation || 0;
            siltHeightMM = data.siltHeight || 0;
            document.getElementById('silt-height').value = (siltHeightMM / heightUnitFactor()).toFixed(1);
            anchorBottomCenter();
          }
          draw();
        }).catch(() => draw());
      }

      function startDrag(e) {
        if (measureMode) {
          var rect = canvas.getBoundingClientRect();
          var x = clamp(e.clientX - rect.left, 0, canvas.width);
          var y = clamp(e.clientY - rect.top, 0, canvas.height);
          if (!measuring && measureStart && measureEnd) {
            if (Math.hypot(x - measureStart.x, y - measureStart.y) < 6) {
              measureDrag = 'start';
              return;
            }
            if (Math.hypot(x - measureEnd.x, y - measureEnd.y) < 6) {
              measureDrag = 'end';
              return;
            }
          }
          startMeasurement(e);
          return;
        }
        if (!editEnabled) return;
        var shape = document.getElementById('shape').value;
        if (editIndex >= 0) {
          dragging = true;
          movePoint(e);
          return;
        }
        dragging = true;
        updateFromMouse(e);
      }

      function drag(e) {
        if (measureMode) {
          if (measureDrag) {
            var rect = canvas.getBoundingClientRect();
            var x = clamp(e.clientX - rect.left, 0, canvas.width);
            var y = clamp(e.clientY - rect.top, 0, canvas.height);
            if (measureDrag === 'start') measureStart = {x:x, y:y};
            else measureEnd = {x:x, y:y};
            draw();
            return;
          }
          if (measuring) { measureMove(e); }
          return;
        }
        if (!dragging) return;
        if (editIndex >= 0) {
          movePoint(e);
        } else {
          updateFromMouse(e);
        }
      }

      function endDrag(e) {
        if (measureMode) {
          measureDrag = null;
          if (measuring) measureMove(e);
          draw();
          return;
        }
        dragging = false;
        if (editIndex >= 0) {
          editIndex = -1;
        }
        anchorBottomCenter();
        draw();
        showCursorPos(e);
        updateRowHighlights();
      }

      function updateFromMouse(e) {
        if (!editEnabled) return;
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        saveState();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        var shape = document.getElementById('shape').value;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;

        var pts = getShapePoints(shape);
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (var i = 0; i < pts.length; i++) {
          minX = Math.min(minX, pts[i].x);
          maxX = Math.max(maxX, pts[i].x);
          minY = Math.min(minY, pts[i].y);
          maxY = Math.max(maxY, pts[i].y);
        }
        var width = maxX - minX;
        var height = maxY - minY;
        ctx.save();
        ctx.setLineDash([4,2]);
        ctx.strokeStyle = '#ff9900';
        ctx.strokeRect(minX, minY, width, height);
        ctx.restore();

        var units = document.getElementById('units').value;
        var wMM = width * mmScale;
        var hMM = height * mmScale;
        var wVal = (wMM / unitFactor()).toFixed(0) + ' ' + units;
        var hVal = (hMM / unitFactor()).toFixed(0) + ' ' + units;
        document.getElementById('width-label').textContent = 'Max Width: ' + wVal;
        document.getElementById('height-label').textContent = 'Max Height: ' + hVal;
        ctx.fillStyle = '#ff9900';
        ctx.textAlign = 'center';
        ctx.fillText(wVal, minX + width / 2, minY - 5);
        ctx.save();
        ctx.translate(minX - 20, minY + height / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(hVal, 0, 0);
        ctx.restore();
        ctx.textAlign = 'start';

        var maxHeight = shapeHeightMM(pts);
        shapePts = pts;
        var whInput = document.getElementById('water-height');
        waterHeightMM = parseFloat(whInput.value) * heightUnitFactor() || 0;
        waterHeightMM = clamp(waterHeightMM, 0, maxHeight);
        whInput.value = (waterHeightMM / heightUnitFactor()).toFixed(1);
        var shInput = document.getElementById('silt-height');
        siltHeightMM = parseFloat(shInput.value) * heightUnitFactor() || 0;
        siltHeightMM = clamp(siltHeightMM, 0, waterHeightMM);
        shInput.value = (siltHeightMM / heightUnitFactor()).toFixed(1);
        var yLine = canvas.height - mmToPxY(waterHeightMM);
        var ySilt = canvas.height - mmToPxY(siltHeightMM);
        if (pts.length > 0) {
          var belowWater = clipBelow(pts, yLine);
          var belowSilt = clipBelow(pts, ySilt);
          var above = clipAbove(pts, yLine);
          if (above.length > 0) {
            ctx.fillStyle = '#cccccc';
            ctx.beginPath();
            ctx.moveTo(above[0].x, above[0].y);
            for (var i = 1; i < above.length; i++) ctx.lineTo(above[i].x, above[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
          if (belowWater.length > 0) {
            ctx.fillStyle = '#99ccff';
            ctx.beginPath();
            ctx.moveTo(belowWater[0].x, belowWater[0].y);
            for (var i = 1; i < belowWater.length; i++) ctx.lineTo(belowWater[i].x, belowWater[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
          if (belowSilt.length > 0) {
            ctx.fillStyle = '#d2b48c';
            ctx.beginPath();
            ctx.moveTo(belowSilt[0].x, belowSilt[0].y);
            for (var i = 1; i < belowSilt.length; i++) ctx.lineTo(belowSilt[i].x, belowSilt[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        }

        if (vectorsVisible) {
          for (var i = 0; i < pts.length; i++) {
            var color = (i === editIndex && editShape === shape) ? '#000' : '#0000ff';
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(pts[i].x, pts[i].y, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.arc(minX, minY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(maxX, maxY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#964B00';
        ctx.beginPath();
        ctx.moveTo(minX, ySilt);
        ctx.lineTo(maxX, ySilt);
        ctx.stroke();
        ctx.strokeStyle = '#00f';
        ctx.beginPath();
        ctx.moveTo(minX, yLine);
        ctx.lineTo(maxX, yLine);
        ctx.stroke();
        ctx.strokeStyle = '#000';
        updateCoords(pts);
        updateRowHighlights();
        var area = polygonArea(pts);
        var waterPts = clipBelow(pts, yLine);
        var siltPts = clipBelow(pts, ySilt);
        var waterArea = polygonArea(waterPts) - polygonArea(siltPts);
        var siltArea = polygonArea(siltPts);
        var units = document.getElementById('units').value;
        var mm2perpx2 = (drawWidthMM / canvas.width) * (drawHeightMM / canvas.height);
        var unitSq = unitFactor() * unitFactor();
        document.getElementById('area-display').textContent = 'Area: ' + (area * mm2perpx2 / unitSq).toFixed(2) + ' ' + units + '^2';
        document.getElementById('water-area-display').textContent = 'Water Area: ' + (waterArea * mm2perpx2 / unitSq).toFixed(2) + ' ' + units + '^2';
        document.getElementById('silt-area-display').textContent = 'Silt Area: ' + (siltArea * mm2perpx2 / unitSq).toFixed(2) + ' ' + units + '^2';
        drawMeasurement();
        autoSave();
      }

      function calculateArea() {
        draw();
      }

      function polygonArea(pts) {
        if (pts.length < 3) return 0;
        var sum = 0;
        for (var i = 0; i < pts.length; i++) {
          var j = (i + 1) % pts.length;
          sum += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
        }
        return Math.abs(sum / 2);
      }

      function shapeHeight(pts) {
        if (pts.length === 0) return 0;
        var minY = canvas.height;
        for (var i = 0; i < pts.length; i++) {
          minY = Math.min(minY, pts[i].y);
        }
        return pxToUnitY(canvas.height - minY);
      }

      function shapeHeightMM(pts) {
        if (pts.length === 0) return 0;
        var minY = canvas.height;
        for (var i = 0; i < pts.length; i++) {
          minY = Math.min(minY, pts[i].y);
        }
        return pxToMMY(canvas.height - minY);
      }

      function clipBelow(pts, yLine) {
        var out = [];
        for (var i = 0; i < pts.length; i++) {
          var a = pts[i];
          var b = pts[(i + 1) % pts.length];
          var aInside = a.y >= yLine;
          var bInside = b.y >= yLine;
          if (aInside && bInside) {
            out.push(b);
          } else if (aInside && !bInside) {
            var x = a.x + (yLine - a.y) * (b.x - a.x) / (b.y - a.y);
            out.push({x: x, y: yLine});
          } else if (!aInside && bInside) {
            var x1 = a.x + (yLine - a.y) * (b.x - a.x) / (b.y - a.y);
            out.push({x: x1, y: yLine});
            out.push(b);
          }
        }
        return out;
      }

      function clipAbove(pts, yLine) {
        var out = [];
        for (var i = 0; i < pts.length; i++) {
          var a = pts[i];
          var b = pts[(i + 1) % pts.length];
          var aInside = a.y <= yLine;
          var bInside = b.y <= yLine;
          if (aInside && bInside) {
            out.push(b);
          } else if (aInside && !bInside) {
            var x = a.x + (yLine - a.y) * (b.x - a.x) / (b.y - a.y);
            out.push({x: x, y: yLine});
          } else if (!aInside && bInside) {
            var x1 = a.x + (yLine - a.y) * (b.x - a.x) / (b.y - a.y);
            out.push({x: x1, y: yLine});
            out.push(b);
          }
        }
        return out;
      }

      function drawMeasurement() {
        if (!measureStart || !measureEnd) return;
        ctx.strokeStyle = '#ff0000';
        ctx.beginPath();
        ctx.moveTo(measureStart.x, measureStart.y);
        ctx.lineTo(measureEnd.x, measureEnd.y);
        ctx.stroke();
        drawArrowHead(measureStart, measureEnd, measureDrag === 'start' ? '#000' : '#ff0000');
        drawArrowHead(measureEnd, measureStart, measureDrag === 'end' ? '#000' : '#ff0000');
        var distPx = Math.hypot(measureEnd.x - measureStart.x, measureEnd.y - measureStart.y);
        var dist = (distPx * mmScale) / unitFactor();
        var units = document.getElementById('units').value;
        ctx.fillStyle = '#ff0000';
        ctx.fillText(dist.toFixed(1) + ' ' + units, (measureStart.x + measureEnd.x) / 2 + 5, (measureStart.y + measureEnd.y) / 2 - 5);
      }

      function drawArrowHead(a, b, color) {
        ctx.fillStyle = color || '#ff0000';
        var angle = Math.atan2(b.y - a.y, b.x - a.x);
        var size = 8;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - size * Math.cos(angle - Math.PI/6), b.y - size * Math.sin(angle - Math.PI/6));
        ctx.lineTo(b.x - size * Math.cos(angle + Math.PI/6), b.y - size * Math.sin(angle + Math.PI/6));
        ctx.closePath();
        ctx.fill();
      }

      function addPoint(e) {
        if (!editEnabled) return;
        var rect = canvas.getBoundingClientRect();
        var x = clamp(e.clientX - rect.left, 0, canvas.width);
        var y = clamp(e.clientY - rect.top, 0, canvas.height);
        var shape = document.getElementById('shape').value;
        var dispPts = getShapePoints(shape);
        var idx = dispPts.length - 1;
        var best = Infinity;
        for (var i = 0; i < dispPts.length; i++) {
          var a = dispPts[i];
          var b = dispPts[(i + 1) % dispPts.length];
          var d = pointSegmentDistance({x: x, y: y}, a, b);
          if (d < best) { best = d; idx = i; }
        }
        var base = toBaseCoords({x: x, y: y}, shape);
        saveState();
        points.splice(idx + 1, 0, base);
        numPoints = points.length;
        anchorBottomCenter();
        draw();
      }

      function handleDoubleClick(e) {
        if (addPointEnabled) {
          addPoint(e);
        } else {
          selectPoint(e);
        }
      }

      function selectPoint(e) {
        if (!editEnabled) return;
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var shape = document.getElementById('shape').value;
        var pts = getShapePoints(shape);
        editIndex = -1;
        for (var i = 0; i < pts.length; i++) {
          var dx = pts[i].x - x;
          var dy = pts[i].y - y;
          if (Math.sqrt(dx*dx + dy*dy) < 6) {
            editIndex = i;
            editShape = shape;
            break;
          }
        }
        draw();
        updateRowHighlights();
      }

      function movePoint(e) {
        if (!(e.buttons & 1) || !editEnabled) return;
        var rect = canvas.getBoundingClientRect();
        var x = clamp(e.clientX - rect.left, 0, canvas.width);
        var y = clamp(e.clientY - rect.top, 0, canvas.height);
        saveState();
        points[editIndex] = {x: x, y: y};
        draw();
      }

      function clearPolygon() {
        saveState();
        points = [];
        draw();
      }

      function resetPolygon() {
        saveState();
        numPoints = parseInt(document.getElementById('num-points').value) || 3;
        points = defaultPolygon(numPoints);
        anchorBottomCenter();
        waterHeightMM = shapeHeightMM(points);
        document.getElementById('water-height').value = (waterHeightMM / heightUnitFactor()).toFixed(1);
        siltHeightMM = 0;
        document.getElementById('silt-height').value = '0';
        draw();
      }

      function defaultPolygon(n) {
        var r = 60;
        var cx = canvas.width / 2;
        var cy = canvas.height - r;
        var pts = [];
        for (var i = 0; i < n; i++) {
          var ang = Math.PI / 2 + (i / n) * Math.PI * 2;
          pts.push({x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang)});
        }
        return pts;
      }

      function resetCircle() {
        saveState();
        var n = parseInt(document.getElementById('circle-points').value) || 30;
        circleDiameterMM = parseFloat(document.getElementById('circle-diameter').value) * unitFactor() || 1000;
        points = defaultCircle(n, circleDiameterMM);
        orientation = 0;
        anchorBottomCenter();
        waterHeightMM = shapeHeightMM(points);
        document.getElementById('water-height').value = (waterHeightMM / heightUnitFactor()).toFixed(1);
        siltHeightMM = 0;
        document.getElementById('silt-height').value = '0';
        draw();
      }

      function defaultCircle(n, diamMM) {
        var r = mmToPxX(diamMM / 2);
        var cx = canvas.width / 2;
        var cy = canvas.height - r;
        var pts = [];
        for (var i = 0; i < n; i++) {
          var ang = Math.PI / 2 + (i / n) * Math.PI * 2;
          pts.push({x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang)});
        }
        return pts;
      }


      function updateCoords(pts) {
        var tbody = document.getElementById('points-table').querySelector('tbody');
        tbody.innerHTML = '';
        for (var i = 0; i < pts.length; i++) {
          var tr = document.createElement('tr');
          tr.dataset.index = i;
          var tdI = document.createElement('td');
          tdI.textContent = i;
          var tdX = document.createElement('td');
          var inputX = document.createElement('input');
          inputX.type = 'number';
          inputX.value = pxToUnitX(pts[i].x).toFixed(1);
          inputX.min = 0;
          inputX.max = drawWidthMM / unitFactor();
          inputX.dataset.index = i;
          inputX.onchange = tableChanged;
          tdX.appendChild(inputX);
          var tdY = document.createElement('td');
          var inputY = document.createElement('input');
          inputY.type = 'number';
          inputY.value = pxToUnitY(canvas.height - pts[i].y).toFixed(1);
          inputY.min = 0;
          inputY.max = drawHeightMM / unitFactor();
          inputY.dataset.index = i;
          inputY.onchange = tableChanged;
          tdY.appendChild(inputY);
          tr.appendChild(tdI);
          tr.appendChild(tdX);
          tr.appendChild(tdY);
          tbody.appendChild(tr);
        }
        updateRowHighlights();
      }

      function updateRowHighlights() {
        var rows = document.getElementById('points-table').querySelectorAll('tbody tr');
        rows.forEach(function(row){
          var idx = parseInt(row.dataset.index);
          row.classList.remove('row-hover', 'row-edit');
          if (idx === hoverIndex) row.classList.add('row-hover');
          if (idx === editIndex && editShape === document.getElementById('shape').value) {
            row.classList.add('row-edit');
          }
        });
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function anchorBottomCenter() {
        if (points.length === 0) return;
        var minX = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (var i = 0; i < points.length; i++) {
          var p = points[i];
          minX = Math.min(minX, p.x);
          maxX = Math.max(maxX, p.x);
          maxY = Math.max(maxY, p.y);
        }
        var dx = canvas.width / 2 - (minX + (maxX - minX) / 2);
        var dy = canvas.height - maxY;
        for (var i = 0; i < points.length; i++) {
          points[i] = {x: points[i].x + dx, y: points[i].y + dy};
        }
      }

      function pointSegmentDistance(p, a, b) {
        var dx = b.x - a.x;
        var dy = b.y - a.y;
        var len2 = dx * dx + dy * dy;
        if (len2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
        var t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
        t = clamp(t, 0, 1);
        var projX = a.x + t * dx;
        var projY = a.y + t * dy;
        return Math.hypot(p.x - projX, p.y - projY);
      }

      function saveState() {
        undoStack.push({points: JSON.parse(JSON.stringify(points)), orientation: orientation});
        if (undoStack.length > 50) undoStack.shift();
        redoStack = [];
      }

      function startMeasurement(e) {
        var rect = canvas.getBoundingClientRect();
        var x = clamp(e.clientX - rect.left, 0, canvas.width);
        var y = clamp(e.clientY - rect.top, 0, canvas.height);
        if (!measureStart || (!measuring && measureEnd)) {
          measureStart = {x: x, y: y};
          measureEnd = {x: x, y: y};
          measuring = true;
        } else if (measuring) {
          measureEnd = {x: x, y: y};
          measuring = false;
        }
        draw();
      }

      function measureMove(e) {
        if (!measuring) return;
        var rect = canvas.getBoundingClientRect();
        var x = clamp(e.clientX - rect.left, 0, canvas.width);
        var y = clamp(e.clientY - rect.top, 0, canvas.height);
        measureEnd = {x: x, y: y};
        draw();
      }

      function clearMeasurement() {
        measureStart = null;
        measureEnd = null;
        measuring = false;
        measureDrag = null;
        draw();
      }

      function tableChanged(e) {
        if (!editEnabled) {
          draw();
          return;
        }
        var idx = parseInt(e.target.dataset.index);
        var row = e.target.parentElement.parentElement;
        var x = unitToPxX(parseFloat(row.children[1].firstChild.value));
        var y = unitToPxY(parseFloat(row.children[2].firstChild.value));
        x = clamp(x, 0, canvas.width);
        y = clamp(y, 0, canvas.height);
        row.children[1].firstChild.value = pxToUnitX(x).toFixed(1);
        row.children[2].firstChild.value = pxToUnitY(y).toFixed(1);
        saveState();
        points[idx] = {x: x, y: canvas.height - y};
        anchorBottomCenter();
        draw();
      }

      function showCursorPos(e) {
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = canvas.height - (e.clientY - rect.top);
        var units = document.getElementById('units').value;
        document.getElementById('cursor-pos').textContent = 'Cursor: (' + pxToUnitX(x).toFixed(1) + ', ' + pxToUnitY(y).toFixed(1) + ' ' + units + ')';
        var py = e.clientY - rect.top;
        var shape = document.getElementById('shape').value;
        var pts = getShapePoints(shape);
        var over = -1;
        for (var i = 0; i < pts.length; i++) {
          if (Math.hypot(pts[i].x - x, pts[i].y - py) < 6) { over = i; break; }
        }
        hoverIndex = over;
        updateRowHighlights();
        var overArrow = false;
        if (measureMode && measureStart && measureEnd && !measuring) {
          if (Math.hypot(measureStart.x - x, measureStart.y - py) < 6 || Math.hypot(measureEnd.x - x, measureEnd.y - py) < 6) {
            overArrow = true;
          }
        }
        if (over >= 0 || editIndex >= 0 || overArrow || measureDrag) {
          canvas.style.cursor = blueCursor;
        } else {
          canvas.style.cursor = 'default';
        }
      }

      function clearCursorPos() {
        document.getElementById('cursor-pos').textContent = 'Cursor:';
        canvas.style.cursor = 'default';
        hoverIndex = -1;
        updateRowHighlights();
      }

      function setOrientation(o) {
        saveState();
        orientation = o;
        draw();
      }

      function getShapePoints(shape) {
        return applyOrientation(points.slice(), shape);
      }

      function applyOrientation(pts, shape) {
        if (orientation == 0) return pts;
        var ang = orientationAngle(shape, pts.length);
        if (ang === 0) return pts;
        var cx = canvas.width / 2;
        var cy = canvas.height;
        var rot = [];
        for (var i = 0; i < pts.length; i++) {
          var dx = pts[i].x - cx;
          var dy = pts[i].y - cy;
          rot.push({
            x: cx + dx * Math.cos(ang) - dy * Math.sin(ang),
            y: cy + dx * Math.sin(ang) + dy * Math.cos(ang)
          });
        }
        return rot;
      }

      function orientationAngle(shape, n) {
        if (orientation == 0) return 0;
        if (shape == 'polygon') return Math.PI / (n || points.length);
        return 0;
      }

      function scaleShape(val) {
        var f = parseFloat(val);
        if (!isFinite(f) || f <= 0) return;
        saveState();
        var cx = canvas.width / 2;
        var cy = canvas.height;
        for (var i = 0; i < points.length; i++) {
          var dx = points[i].x - cx;
          var dy = points[i].y - cy;
          points[i].x = cx + dx * (f / polygonScale);
          points[i].y = cy + dy * (f / polygonScale);
        }
        polygonScale = f;
        anchorBottomCenter();
        draw();
      }

      function toBaseCoords(pt, shape) {
        var ang = orientationAngle(shape);
        if (ang === 0) return pt;
        var cx = canvas.width / 2;
        var cy = canvas.height;
        var dx = pt.x - cx;
        var dy = pt.y - cy;
        return {
          x: cx + dx * Math.cos(-ang) - dy * Math.sin(-ang),
          y: cy + dx * Math.sin(-ang) + dy * Math.cos(-ang)
        };
      }

      function undoEdit() {
        if (undoStack.length === 0) return;
        redoStack.push({points: JSON.parse(JSON.stringify(points)), orientation: orientation});
        var state = undoStack.pop();
        points = JSON.parse(JSON.stringify(state.points));
        orientation = state.orientation;
        anchorBottomCenter();
        draw();
      }

      function redoEdit() {
        if (redoStack.length === 0) return;
        undoStack.push({points: JSON.parse(JSON.stringify(points)), orientation: orientation});
        var state = redoStack.pop();
        points = JSON.parse(JSON.stringify(state.points));
        orientation = state.orientation;
        anchorBottomCenter();
        draw();
      }

      function saveShape() {
        var name = document.getElementById('shape-name').value.trim();
        if (!name) return;
        fetch('/save_shape', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: name, points: points.map(p => ({x: pxToMMX(p.x), y: pxToMMY(p.y)})), orientation: orientation, siltHeight: siltHeightMM})
        }).then(updateShapeList);
      }

      function autoSave() {
        fetch('/save_shape', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: '_last', points: points.map(p => ({x: pxToMMX(p.x), y: pxToMMY(p.y)})), orientation: orientation, siltHeight: siltHeightMM})
        });
      }

      function updateShapeList() {
        fetch('/list_shapes').then(r => r.json()).then(data => {
          var sel = document.getElementById('load-list');
          sel.innerHTML = '';
          data.shapes.forEach(function(n){
            var opt = document.createElement('option');
            opt.value = n;
            opt.textContent = n;
            sel.appendChild(opt);
          });
        });
      }

      function loadShape() {
        var name = document.getElementById('load-list').value;
        if (!name) return;
        fetch('/load_shape/' + name).then(r => r.json()).then(data => {
          if (data.points) {
            saveState();
            points = data.points.map(p => ({x: mmToPxX(p.x), y: mmToPxY(p.y)}));
            orientation = data.orientation || 0;
            siltHeightMM = data.siltHeight || 0;
            document.getElementById('silt-height').value = (siltHeightMM / heightUnitFactor()).toFixed(1);
            document.getElementById('shape').value = 'polygon';
            anchorBottomCenter();
            draw();
          }
        });
      }

      function openShapeDialog() {
        updateShapeList();
        document.getElementById('shape-dialog').showModal();
      }

      function closeShapeDialog() {
        document.getElementById('shape-dialog').close();
      }

      function openNewChannelDialog() {
        document.getElementById('new-channel-dialog').showModal();
      }

      function closeNewChannelDialog() {
        document.getElementById('new-channel-dialog').close();
      }

      function openSetupDialog() {
        document.getElementById('setup-dialog').showModal();
      }

      function closeSetupDialog() {
        document.getElementById('setup-dialog').close();
      }

      function drawGrid() {
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1;
        var stepX = mmToPxX(gridSpacingMM);
        var stepY = mmToPxY(gridSpacingMM);
        for (var x = 0; x <= canvas.width; x += stepX) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (var y = 0; y <= canvas.height; y += stepY) {
          var gy = canvas.height - y;
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(canvas.width, gy);
          ctx.stroke();
        }
        ctx.strokeStyle = '#000';
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        ctx.lineTo(canvas.width, canvas.height);
        ctx.moveTo(0, canvas.height);
        ctx.lineTo(0, 0);
        ctx.stroke();
        var spacingXMM = gridSpacingMM;
        var spacingYMM = gridSpacingMM;
        var units = document.getElementById('units').value;
        for (var i = 0, x = 0; x <= canvas.width; x += stepX, i++) {
          var val = (i * spacingXMM / unitFactor()).toFixed(1);
          ctx.fillText(val, x + 2, canvas.height - 2);
        }
        for (var i = 0, y = 0; y <= canvas.height; y += stepY, i++) {
          var val = (i * spacingYMM / unitFactor()).toFixed(1);
          ctx.fillText(val, 2, canvas.height - y - 2);
        }
        ctx.fillText('x', canvas.width - 10, canvas.height - 5);
        ctx.fillText('y', 5, 10);
      }

      window.onload = init;
  </script>
  </body>
